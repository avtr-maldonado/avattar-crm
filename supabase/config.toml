project_id = "avattar-crm"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 16

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = false  # alta de usuarios vía invitación/Entra ID, no autoregistro

# SSO con Entra ID (Microsoft) — pendiente de credenciales reales antes de habilitar.
# [auth.external.azure]
# enabled = true
# client_id = ""
# secret = ""
# url = ""

[storage]
enabled = true
file_size_limit = "50MiB"  # ver requisito no funcional §13: documentos hasta 50 MB
